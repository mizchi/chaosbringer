name: Install Playwright Chromium
description: >-
  Installs Chromium (unless the browser cache already restored it) and the
  system packages it needs, keeping the .deb archives apt downloads in the
  Actions cache so the next run installs them without the Ubuntu mirror.

# Why: `playwright install-deps` runs apt-get, and every library it asks for
# is already on the runner image. What apt downloads is ~20-22 MB of fonts,
# and the runner's mirror has served those at 22-46 kB/s, 8 to 13.5 minutes
# per install (Nov 5-6 2026; see the install bound in ci.yml). This action
# keeps those archives. With them, apt only installs from local files, and the
# mirror is asked for nothing but the package lists.
#
# How:
#   1. Restore ~/.cache/playwright-apt. The key is the image and the Playwright
#      version, which together decide the package set; any older entry of the
#      same OS is the fallback.
#   2. Copy the archives into /var/cache/apt/archives, where apt-get looks
#      before downloading.
#   3. Install as before (`install-deps`, or `install --with-deps` when the
#      browser has to be downloaded too).
#   4. When the exact key was not restored, `apt-get autoclean` drops archives
#      the package lists no longer offer (superseded versions from a fallback
#      entry). Then the archives this job put there (the restored ones and the
#      ones apt just downloaded, told apart from the image's own files by a
#      marker) are saved under the exact key.
#
# Trust: apt checks a local archive against the hash in the signed package
# lists before installing it, and downloads it again on a mismatch, so an
# archive from the cache is installed only if it is the one the mirror would
# have served. A pull request's cache entries are visible only to that pull
# request: it can read main's entries but not write them.
#
# The caller's step keeps `timeout-minutes`: a composite step cannot carry
# one, and a cache miss still downloads at the mirror's speed.

inputs:
  browser-cached:
    description: >-
      'true' when ~/.cache/ms-playwright was restored, so only the system
      packages are installed; anything else also downloads Chromium.
    default: "false"
  working-directory:
    description: >-
      Where to run `pnpm exec playwright` (a job's `defaults.run` does not
      reach a composite action's steps).
    default: "."

runs:
  using: composite
  steps:
    - name: Key the apt archive cache
      id: key
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        version=$(pnpm exec playwright --version)
        version=${version##* }
        prefix="playwright-apt-${ImageOS:-unknown-os}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix${ImageVersion:-unknown-image}-playwright-$version" >> "$GITHUB_OUTPUT"

    - name: Restore apt's archives
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/playwright-apt
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    # The cache is an optimisation: a step of it that fails warns and lets
    # the install run as it would without it.
    - name: Seed apt's archive directory
      shell: bash
      run: |
        cache="$HOME/.cache/playwright-apt"
        mkdir -p "$cache"
        # Archives copied in or downloaded after this point are this job's.
        touch "$RUNNER_TEMP/playwright-apt.marker"
        shopt -s nullglob
        debs=("$cache"/*.deb)
        if [ ${#debs[@]} -gt 0 ] && ! sudo cp -- "${debs[@]}" /var/cache/apt/archives/; then
          echo "::warning title=apt archive cache::could not copy the cached archives into /var/cache/apt/archives; apt downloads them instead"
        fi
        echo "Seeded /var/cache/apt/archives with ${#debs[@]} cached archives ($(du -sh "$cache" | cut -f1))."

    - name: Install Chromium and its system packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSER_CACHED: ${{ inputs.browser-cached }}
      run: |
        if [ "$BROWSER_CACHED" = true ]; then
          pnpm exec playwright install-deps chromium
        else
          pnpm exec playwright install --with-deps chromium
        fi

    - name: Collect apt's archives
      id: collect
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cache="$HOME/.cache/playwright-apt"
        warn() { echo "::warning title=apt archive cache::$1"; }
        sudo apt-get autoclean -qq || warn "apt-get autoclean failed; superseded archives may be cached too"
        rm -f "$cache"/*.deb
        mapfile -t debs < <(find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -cnewer "$RUNNER_TEMP/playwright-apt.marker")
        count=${#debs[@]}
        if [ "$count" -eq 0 ]; then
          warn "apt left no archives in /var/cache/apt/archives, so there is nothing to cache and the next run downloads them again"
        elif ! cp -- "${debs[@]}" "$cache"/; then
          warn "could not copy apt's archives for caching"
          count=0
        fi
        echo "count=$count" >> "$GITHUB_OUTPUT"
        echo "Caching $count archives ($(du -sh "$cache" | cut -f1))."

    # Not when nothing was collected: an empty entry would be restored by its
    # exact key on every later run, which then never collects again.
    - name: Save apt's archives
      if: steps.restore.outputs.cache-hit != 'true' && steps.collect.outputs.count != '0'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/playwright-apt
        key: ${{ steps.key.outputs.key }}
