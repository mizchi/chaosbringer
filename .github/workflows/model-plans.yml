# Regenerate the committed model plans and fail if they drifted.
#
# Enumeration needs Quint + a JVM (Apalache), which is exactly why it does not
# run on PRs: `chaosbringer model run` replays committed plan files and needs
# neither. This job exists so a model edit that nobody recompiled is caught
# here rather than silently leaving the plans stale.
name: model plans

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/*/model/**"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example:
          - model-faults
          - cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build chaosbringer (for the model CLI)
        run: pnpm -F chaosbringer build

      - name: Enumerate witnesses into a scratch directory
        working-directory: examples/${{ matrix.example }}
        # OUT keeps the committed traces untouched: they carry a "Created by
        # Apalache on <timestamp>" line, so regenerating them in place would
        # make every run look dirty.
        run: OUT=/tmp/fresh-traces model/enumerate.sh

      - name: Compile the fresh witnesses
        working-directory: examples/${{ matrix.example }}
        run: |
          node ../../packages/chaosbringer/dist/cli.js model compile \
            --traces /tmp/fresh-traces --out /tmp/fresh-plans

      - name: Compare against the committed plans
        working-directory: examples/${{ matrix.example }}
        # Semantic comparison, not `git diff`: what matters is the injection
        # schedule and the oracle, not which equivalent witness the solver
        # happened to return this time.
        run: node ../model-faults/model/check-plans.mjs model/plans /tmp/fresh-plans
