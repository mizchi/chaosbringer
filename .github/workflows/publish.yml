name: publish

# Releases are version bumps. Raise `version` in a package's package.json
# (and its CHANGELOG.md), merge to main, and this workflow publishes every
# package whose version is not on npm yet, dependencies first, with npm OIDC
# Trusted Publishing. Each published version is tagged `<dir>-v<version>`.
# workflow_dispatch re-runs it, e.g. after a refused publish was fixed.
#
# The npm Trusted Publisher of every package points at this file
# (mizchi/chaosbringer, `publish.yml`), so keep its name.
on:
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"
  workflow_dispatch:

permissions:
  # Pushes the release tags.
  contents: write
  # npm OIDC Trusted Publishing and provenance.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-publish-deps.mjs compares each workspace dependency with the
          # tag of its released version, so it needs the history and tags.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5 for OIDC Trusted Publishing.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (recursive — workspace deps must be built before any package publishes)
        run: pnpm -r build

      - name: Publish the versions npm does not have yet, dependencies first
        run: |
          set -euo pipefail
          pending="$(node scripts/pending-publishes.mjs)"
          if [[ -z "$pending" ]]; then
            echo "Every package's version is already on npm; nothing to publish."
            exit 0
          fi
          echo "Publishing, in this order:"
          echo "$pending"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in $pending; do
            # Refuses when a workspace dependency is not on npm as this package
            # was built against it (chaosbringer@0.10.0 shipped importing an
            # export playwright-faults had not released), and imports every
            # entry of the packed package installed from npm.
            node scripts/check-publish-deps.mjs "$dir"
            # pnpm publish (NOT npm publish): rewrites `workspace:^` refs to
            # the workspace packages' versions. `npm publish` leaves them as
            # literal strings (chaosbringer@0.8.0 shipped that way).
            (cd "$dir" && pnpm publish --access public --provenance --no-git-checks)
            tag="$(basename "$dir")-v$(node -p "require('./$dir/package.json').version")"
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "::warning::tag $tag already exists; left as is"
            else
              git tag -a "$tag" -m "$tag"
              git push origin "refs/tags/$tag"
            fi
          done
