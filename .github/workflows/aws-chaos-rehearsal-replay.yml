# Deterministic regression gate for the AWS chaos rehearsal harness.
#
# Replays one or more checked-in fixture runs against scoreScenario
# WITHOUT hitting any live env (no kumo, no target, no LLM API). The
# job catches rubric primitive regressions, scoring pipeline drift,
# and silent wire-format changes that invalidate baselines.
#
# This is intentionally narrow and cheap — minutes-per-PR rather than
# the hours-per-week of a full live-agent sweep. Live-agent regression
# coverage (option B in #117) is tracked separately.
name: aws-chaos-rehearsal-replay

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/aws-faults/**"
      - "examples/aws-chaos-rehearsal/**"
      - ".github/workflows/aws-chaos-rehearsal-replay.yml"

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck aws-faults
        run: pnpm -F "@mizchi/aws-faults" typecheck

      - name: Sweep all fixtures
        run: pnpm -F aws-chaos-rehearsal-example sweep --fail-on-regression --report /tmp/sweep.md

      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-report
          path: /tmp/sweep.md
