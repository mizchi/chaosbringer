name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The job's own 10 minutes plus the Playwright install step's 15-minute
    # bound (see that step): every job here that installs Playwright adds it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint — no NUL bytes in source (all workspace packages)
        run: pnpm -r lint:nul

      # `vp lint src` (Oxlint, configured in the package's vite.config.ts),
      # correctness rules as errors (as lightbringer's own leg below lints its
      # package). Reads `src/` only, so it does not depend on the build step.
      - name: Lint
        run: pnpm -F chaosbringer lint

      # The skill's snippets are the first thing a new reader runs, and a
      # snippet naming an export that does not exist was the most-reported
      # friction across twelve evaluation runs. Reads `src/`, not `dist/`, so it
      # does not depend on the build step below.
      - name: Check the chaosbringer skill's docs against the real exports
        run: pnpm check:skill-docs

      - name: Check that workflow shell blocks parse
        run: pnpm check:workflow-shell

      - name: Build
        run: pnpm -F chaosbringer build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Both installs run apt-get through sudo, and the runner's Ubuntu mirror
      # is sometimes slow rather than down: on Nov 5-6 2026 it served the
      # ~22 MB of fonts `install-deps` fetches (the libraries are already on
      # the image) at ~39 kB/s, 9m22s, so a 10-minute job was cancelled
      # before its tests and an 8-minute step bound killed the download. The
      # step bound is the install's own budget: a slow mirror still finishes
      # inside it, and a stalled one fails the install step by name instead
      # of timing out the job (chaos-pr-gate.yml has the 24-minute hang that
      # bound is for). Each job's timeout is what it needed before plus these
      # 15 minutes.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium

      - name: Test
        run: pnpm -F chaosbringer test

      - name: Typecheck examples
        run: |
          pnpm -F "@mizchi/chaosbringer-example-cloudflare-worker" typecheck
          pnpm -F "@mizchi/chaosbringer-example-playwright-test" typecheck
          pnpm -F "@mizchi/chaosbringer-example-model-faults" typecheck
          pnpm -F "@mizchi/chaosbringer-example-perf-patterns" typecheck
          pnpm -F "@mizchi/chaosbringer-example-data-patterns" typecheck

  lightbringer:
    # lightbringer is its own published package with its own toolchain
    # (`vp pack` / tsdown, `vp test` / Vitest 5, `vp lint` / Oxlint, Playwright
    # specs), and chaosbringer's `--perf` runs on its `lightbringer/core`
    # build, so it gets its own leg instead of riding on build-and-test: a
    # break here names itself in the checks list.
    # `lightbringer-perf.yml` is the separate, path-filtered budget gate; this
    # job is correctness, on every PR.
    runs-on: ubuntu-latest
    # 15 plus the install step's 15-minute bound (see build-and-test).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/lightbringer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # `lightbringer...` = lightbringer plus its workspace dependencies:
      # the clock-skew spec imports `@mizchi/playwright-faults`, which
      # resolves to that package's dist/.
      - name: Build
        working-directory: .
        run: pnpm -F "lightbringer..." build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium

      # The local specs only: they measure the vite fixture app the config's
      # webServer starts. example.spec.ts (example.com), react-dev.spec.ts
      # (react.dev) and real-world.spec.ts (`real:` titles) measure live
      # internet sites, whose numbers and availability are not this repo's
      # to gate on. Excluded by title so a new local spec is picked up
      # without editing this list.
      - name: Playwright specs (local fixtures)
        run: pnpm exec playwright test --grep-invert "example.com|react.dev|real:"

  example-tests:
    # Runs in parallel with build-and-test. Each matrix value is its own
    # runner, so cloudflare-worker and playwright-test execute concurrently.
    # Both need the Playwright Chromium browser (chaosbringer drives Chromium
    # internally) and a `pnpm install` of the workspace.
    runs-on: ubuntu-latest
    # 10 plus the install step's 15-minute bound (see build-and-test).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        example:
          - cloudflare-worker
          - playwright-test
          - model-faults
          # One crawl per case and no medians to take, so the whole catalog
          # fits one runner unsharded (PATTERN_SHARD works if it grows).
          - data-patterns
        # perf-patterns measures every pattern one after another (parallel
        # browsers on one runner would blur the numbers being compared), so a
        # single job grew to ~7 minutes. It is split over runners instead:
        # PATTERN_SHARD=<i>/<n> deals the catalog round-robin, and the n
        # shards together run every pattern exactly once.
        include:
          - example: perf-patterns
            shard: 1/3
          - example: perf-patterns
            shard: 2/3
          - example: perf-patterns
            shard: 3/3
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium

      - name: Test example
        run: pnpm -F "@mizchi/chaosbringer-example-${{ matrix.example }}" test
        env:
          WRANGLER_SEND_METRICS: "false"
          # Empty outside the perf-patterns shards: the whole catalog.
          PATTERN_SHARD: ${{ matrix.shard }}

  adversarial:
    # The red-team suites: each one is an app built to walk past the oracle, in
    # a buggy and a corrected variant, asserting that the buggy one now fails.
    # They were dev-time scripts nobody ran, which is the same failure the
    # audit's own F6 finding was about — a check that cannot fail, and a check
    # nobody invokes, are indistinguishable from the outside.
    #
    # Its own job rather than a step in example-tests: ~5 minutes of browser
    # work would more than double that job's 2m34s, and a separate leg names
    # itself in the checks list when it breaks.
    runs-on: ubuntu-latest
    # 20 plus the install step's 15-minute bound (see build-and-test).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: npx playwright install-deps chromium

      - name: Red-team suites
        run: pnpm -F "@mizchi/chaosbringer-example-model-faults" test:adversarial
