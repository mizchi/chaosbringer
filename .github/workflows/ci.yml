name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint — no NUL bytes in source (all workspace packages)
        run: pnpm -r lint:nul

      # The skill's snippets are the first thing a new reader runs, and a
      # snippet naming an export that does not exist was the most-reported
      # friction across twelve evaluation runs. Reads `src/`, not `dist/`, so it
      # does not depend on the build step below.
      - name: Check the chaosbringer skill's docs against the real exports
        run: pnpm check:skill-docs

      - name: Build
        run: pnpm -F chaosbringer build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test
        run: pnpm -F chaosbringer test

      - name: Typecheck examples
        run: |
          pnpm -F "@mizchi/chaosbringer-example-cloudflare-worker" typecheck
          pnpm -F "@mizchi/chaosbringer-example-playwright-test" typecheck
          pnpm -F "@mizchi/chaosbringer-example-model-faults" typecheck

  example-tests:
    # Runs in parallel with build-and-test. Each matrix value is its own
    # runner, so cloudflare-worker and playwright-test execute concurrently.
    # Both need the Playwright Chromium browser (chaosbringer drives Chromium
    # internally) and a `pnpm install` of the workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example:
          - cloudflare-worker
          - playwright-test
          - model-faults
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test example
        run: pnpm -F "@mizchi/chaosbringer-example-${{ matrix.example }}" test
        env:
          WRANGLER_SEND_METRICS: "false"

  adversarial:
    # The red-team suites: each one is an app built to walk past the oracle, in
    # a buggy and a corrected variant, asserting that the buggy one now fails.
    # They were dev-time scripts nobody ran, which is the same failure the
    # audit's own F6 finding was about — a check that cannot fail, and a check
    # nobody invokes, are indistinguishable from the outside.
    #
    # Its own job rather than a step in example-tests: ~5 minutes of browser
    # work would push that job's 2m34s close to its 10-minute limit, and a
    # separate leg names itself in the checks list when it breaks.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Red-team suites
        run: pnpm -F "@mizchi/chaosbringer-example-model-faults" test:adversarial
