<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Profile</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
      .banner { padding: .75rem 1rem; border-radius: .4rem; margin: 1rem 0; background: #f3f4f6; }
      [data-state="stale"] .banner { background: #fef3c7; }
      [data-state="fresh"] .banner { background: #ecfdf5; }
      button { padding: .5rem 1rem; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main id="app" data-state="idle">
      <h1>Profile</h1>
      <p id="profile" data-rev="0">Loading…</p>
      <button id="refresh">Refresh profile</button>
      <p class="banner" id="banner">Nothing loaded yet.</p>
    </main>
    <script src="/cache.js"></script>
  </body>
</html>
