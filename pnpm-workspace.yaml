packages:
  - "packages/*"
  - "examples/*"
  - "playground"
# vite-plus 1.3.0 depends on exactly vitest 5.0.5 and on `vite` as this alias
# at its own version, so bump the three together: any other vitest here is a
# second vitest in the lockfile, and `from "vitest"` in a test file may then
# import a different one than `vp test` runs.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
# One Vite, the alias. The override does not reach the `vite` peer that pnpm
# installs for vitest; the root package.json's `vite` devDependency does.
overrides:
  vite@*: "catalog:"
# The alias reports vite-plus's version (1.3.0), which the `vite` peer ranges of
# vitest and @vitejs/plugin-react do not name.
peerDependencyRules:
  allowAny:
    - vite
